name: Build and Test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test
  mutation:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    permissions:
      contents: read
      issues: write
      pull-requests: write
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Restore previous mutation baseline
        id: restore-baseline
        uses: actions/cache/restore@v4
        with:
          path: mutation_baseline.txt
          key: mutation-baseline-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            mutation-baseline-${{ github.ref_name }}-

      - name: Read baseline value
        id: baseline
        run: |
          if [ -f mutation_baseline.txt ]; then
            BASE=$(grep -oP '[0-9]+' mutation_baseline.txt)
            echo "Found previous baseline: $BASE"
            echo "baseline=$BASE" >> $GITHUB_OUTPUT
          else
            echo "No baseline found, defaulting to 0"
            echo "baseline=0" >> $GITHUB_OUTPUT
          fi

      - name: Build module core before PIT
        run: mvn -B -pl core -am -DskipTests install

      - name: Run PIT mutation analysis
        run: mvn -B -pl core org.pitest:pitest-maven:mutationCoverage

      - name: Extract mutation score from PIT report (Python)
        id: parse
        run: |
          python3 << 'EOF'
          import re, sys, pathlib

          report = pathlib.Path("core/target/pit-reports/index.html")
          if not report.exists():
            print("ERROR: PIT index.html not found")
            sys.exit(2)

          html = report.read_text()

          m = re.search(r"Mutation Coverage.*?([0-9]+)%", html, flags=re.S)
          if not m:
            print("ERROR: mutation score not found in HTML")
            sys.exit(3)

          score = m.group(1)
          print(f"Extracted mutation score: {score}")
          print(f"score={score}")  # for debugging
          with open("current_score.txt", "w") as f:
            f.write(score)
          EOF

          echo "score=$(cat current_score.txt)" >> $GITHUB_OUTPUT

      - name: Compare current score to baseline
        id: compare
        run: |
          BASE=${{ steps.baseline.outputs.baseline }}
          CUR=${{ steps.parse.outputs.score }}

          echo "Baseline score : $BASE"
          echo "Current  score : $CUR"

          if [ "$CUR" -lt "$BASE" ]; then
            echo "❌ Mutation score decreased ($CUR < $BASE). Failing build."
            exit 1
          else
            echo "✔ Mutation score OK ($CUR >= $BASE)"
          fi

      - name: Save new baseline file
        run: |
          echo "${{ steps.parse.outputs.score }}" > mutation_baseline.txt

      - name: Save new baseline into cache
        uses: actions/cache/save@v4
        with:
          path: mutation_baseline.txt
          key: mutation-baseline-${{ github.ref_name }}-${{ github.run_id }}

           # 🎵 Rickroll si le build échoue 🎵
      - name: Très important de regarder le score de mutation qui a baissé dans le link 
        if: failure()
        uses: ./.github/actions/rickroll
        with:
          message: "Mutation score decreased for commit ${{ github.sha }}"
