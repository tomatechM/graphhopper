#Credits to TejasvOnly
name: "Rickroll"
description: "Affiche un Rickroll dans les logs du workflow"
inputs:
  message:
    description: "Message supplémentaire à afficher"
    required: false

runs:
  using: "composite"
  steps:
    - name: Never gonna give you up
      shell: bash
      env:
        MSG: ${{ inputs.message }}
        
      run: |
        # --- Logs classiques ---
        echo "======================================="
        echo "🎵  NEVER GONNA GIVE YOU UP  🎵"
        echo "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        echo "======================================="
        if [ -n "$MSG" ]; then
          echo "$MSG"
        fi

        # --- Résumé du job (avec GIF) ---
        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          {
            echo "## Rickroll 😈"
            echo
            echo "![Rickroll GIF](https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif)"
            echo
            if [ -n "$MSG" ]; then
              echo "$MSG"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi
