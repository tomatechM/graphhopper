name: "Rickroll"
description: "Lien caché vers le score de mutation (Rickroll)"

runs:
  using: "composite"
  steps:
    - name: Ajouter le lien caché
      shell: bash
      run: |
        # On n'affiche rien dans les logs, seulement dans le résumé
        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          echo "[Regarder le score de mutation](https://www.youtube.com/watch?v=dQw4w9WgXcQ)" >> "$GITHUB_STEP_SUMMARY"
        fi


      
